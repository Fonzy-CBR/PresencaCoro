let S={members:[],events:[],att:{}};
const saveLocal=()=>localStorage.setItem(K,JSON.stringify(S));
let syncTimer=null, loadingCloud=false;
const memberDoc=m=>{const {perm,pw,...clean}=m;return clean};
async function syncCloud(){
  if(!db||!authUser||loadingCloud)return;
  const b=db.batch();
  S.members.forEach(m=>b.set(db.collection('members').doc(m.id),memberDoc(m),{merge:true}));
  S.events.forEach(x=>b.set(db.collection('events').doc(x.id),x,{merge:true}));
  Object.entries(S.att).forEach(([id,records])=>b.set(db.collection('attendance').doc(id),{records},{merge:true}));
  await b.commit();
}
const save=()=>{saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncCloud().catch(showFirebaseError),250)};
function showFirebaseError(err){console.error(err);alert('Firebase: '+(err?.message||'Nao foi possivel guardar os dados.'))}
function stopListeners(){listeners.forEach(x=>x());listeners=[]}
function listenCloud(){
  stopListeners(); loadingCloud=true;
  let parts={members:false,events:false,attendance:false,permissions:false};
  const done=()=>{if(Object.values(parts).every(Boolean)){loadingCloud=false;saveLocal();render()}};
  listeners.push(db.collection('members').onSnapshot(q=>{S.members=q.docs.map(d=>({id:d.id,...d.data()}));parts.members=true;done()},showFirebaseError));
  listeners.push(db.collection('events').onSnapshot(q=>{S.events=q.docs.map(d=>({id:d.id,...d.data()}));parts.events=true;done()},showFirebaseError));
  listeners.push(db.collection('attendance').onSnapshot(q=>{S.att={};q.docs.forEach(d=>S.att[d.id]=d.data().records||{});parts.attendance=true;done()},showFirebaseError));
  listeners.push(db.collection('permissions').onSnapshot(q=>{const map={};q.docs.forEach(d=>map[d.id]=d.data());S.members.forEach(m=>{const p=m.authUid&&map[m.authUid];m.perm=p?.canWrite?'escrita':'leitura';m.role=p?.role||'member'});parts.permissions=true;done()},showFirebaseError));
}
async function bootstrapAdmin(user){
  const pref=db.collection('permissions').doc(user.uid), ps=await pref.get();
  if(!ps.exists&&user.email===ADMIN_EMAIL){
    await pref.set({role:'admin',canWrite:true,email:user.email});
    const existing=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
    if(existing.empty)await db.collection('members').add({authUid:user.uid,nome:'Administrador',naipe:'Baixos',tel:'',email:user.email,foto:'',ativo:true});
  }
}
let U={tab:'eventos',fT:'',fN:'',ef:null,mf:null,ce:'',am:'',err:''};
const $=s=>document.querySelector(s),g=id=>document.getElementById(id)?.value;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d.split('-').reverse().join('/');
const me=()=>S.members.find(m=>m.authUid===authUser?.uid);
const isSu=()=>me()?.role==='admin',canW=()=>{const u=me();return !!u&&(u.role==='admin'||u.perm==='escrita')};
const evs=()=>S.events.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
const act=()=>S.members.filter(m=>m.ativo);
const srt=l=>l.slice().sort((a,b)=>NAIPES.indexOf(a.naipe)-NAIPES.indexOf(b.naipe)||a.nome.localeCompare(b.nome,'pt'));
const opts=(l,v,all)=>(all!==undefined?`<option value="">${all}</option>`:'')+l.map(x=>`<option ${x===v?'selected':''}>${e(x)}</option>`).join('');
const pct=c=>{const t=c.P+c.A+c.F;return t?(c.P+c.A)/t*100:null};
const fp=p=>p===null?'—':p.toFixed(0)+'%';
function tally(ms,el){const c={P:0,A:0,J:0,F:0};ms.forEach(m=>el.forEach(x=>{const s=S.att[x.id]?.[m.id]?.s;if(s)c[s]++}));return c}
const avatar=(m,z=44)=>m.foto?`<img src="${m.foto}" style="width:${z}px;height:${z}px" class="rounded-full object-cover shrink-0">`:`<div style="width:${z}px;height:${z}px" class="rounded-full bg-neutral-200 flex items-center justify-center text-neutral-600 font-medium shrink-0">${e(m.nome.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`;
const bar=p=>`<div class="bar mt-1"><i style="width:${p||0}%"></i></div>`;
const go=(k,v)=>{U[k]=v;render()};

function loginV(){

async function login(){U.err='';try{await auth.signInWithEmailAndPassword(g('le').trim(),g('lp'))}catch(err){U.err='Email ou password incorretos.';render()}}

async function resetPw(){const email=g('le').trim();if(!email)return alert('Indique primeiro o email.');try{await auth.sendPasswordResetEmail(email);alert('Foi enviado um email para redefinir a password.')}catch(err){showFirebaseError(err)}}

perm(){

function evFormV(){const f=U.ef;return `<div class="card p-5 mb-4 grid md:grid-cols-2 gap-3"><div><label class="l">Título</label><input id="f_t" class="inp" value="${e(f.titulo)}"></div>
 <div><label class="l">Data</label><input id="f_d" type="date" class="inp" value="${f.data}"></div><div><label class="l">Hora</label><input id="f_h" type="time" class="inp" value="${f.hora}"></div>
 <div><label class="l">Tipo</label><select id="f_tp" class="inp">${opts(TIPOS,f.tipo)}</select></div><div class="md:col-span-2"><label class="l">Local</label><input id="f_l" class="inp" value="${e(f.local)}"></div>
 <div class="md:col-span-2 flex gap-2"><button class="btn" onclick="evSave()">Guardar evento</button><button class="btn sec" onclick="go('ef',null)">Cancelar</button></div></div>`}
function evForm(k){U.ef=k==='w'?{titulo:'Ensaio semanal',hora:'21:30',tipo:'Ensaio',local:'Sede',data:today()}:k?{...S.events.find(x=>x.id===k)}:{titulo:'',data:today(),hora:'',tipo:'Ensaio',local:''};render()}
function evSave(){const t=g('f_t').trim(),d=g('f_d');if(!t||!d)return alert('Preencha o título e a data.');
 const o={titulo:t,data:d,hora:g('f_h'),tipo:g('f_tp'),local:g('f_l')};
 if(U.ef.id)Object.assign(S.events.find(x=>x.id===U.ef.id),o);else S.events.push({id:uid(),...o});
 U.ef=null;save();render()}
function evDel(id){if(!confirm('Apagar este evento e as respetivas presenças?'))return;S.events=S.events.filter(x=>x.id!==id);delete S.att[id];if(db){db.collection('events').doc(id).delete();db.collection('attendance').doc(id).delete()}save();render()}
function goCall(id){U.tab='chamada';U.ce=id;render()}
function setSt(mid,s){if(!canW())return;const a=S.att[U.ce]??={};const r=a[mid]??={};r.s=r.s===s?'':s;save();render()}
function setNote(mid,n){if(!canW())return;const a=S.att[U.ce]??={};(a[mid]??={}).n=n;save()}
function allP(){const a=S.att[U.ce]??={};act().filter(m=>!U.fN||m.naipe===U.fN).forEach(m=>(a[m.id]??={}).s='P');save();render()}

function mFormV(){const f=U.mf;return `<div class="card p-5 mb-4 grid md:grid-cols-2 gap-3"><div><label class="l">Nome</label><input id="m_n" class="inp" value="${e(f.nome||'')}"></div>
 <div><label class="l">Naipe</label><select id="m_np" class="inp">${opts(NAIPES,f.naipe)}</select></div><div><label class="l">Telefone / Contacto</label><input id="m_t" class="inp" value="${e(f.tel||'')}"></div>
 <div><label class="l">Email</label><input id="m_e" type="email" class="inp" value="${e(f.email||'')}"></div>
 <div><label class="l">Estado</label><select id="m_a" class="inp"><option value="1" ${f.ativo!==false?'selected':''}>Ativo</option><option value="0" ${f.ativo===false?'selected':''}>Inativo</option></select></div>
 <div class="flex items-end gap-3"><img id="prev" src="${f.foto||''}" class="w-14 h-14 rounded-full object-cover ${f.foto?'':'hidden'}"><div><label class="l">Fotografia</label><input type="file" accept="image/*" onchange="pickFoto(this)" class="text-sm"></div></div>
 <div class="md:col-span-2"><label class="l">UID do Firebase Authentication</label><input id="m_uid" class="inp" value="${e(f.authUid||'')}" placeholder="Criar utilizador na consola Firebase e colar aqui o UID"></div>
 <div class="md:col-span-2 flex gap-2"><button class="btn" onclick="mSave()">Guardar coralista</button><button class="btn sec" onclick="go('mf',null)">Cancelar</button></div></div>`}
function pickFoto(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);U.mf.foto=c.toDataURL('image/jpeg',.8);const p=document.getElementById('prev');p.src=U.mf.foto;p.classList.remove('hidden')};im.src=r.result};r.readAsDataURL(f)}
function mSave(){const n=g('m_n').trim();if(!n)return alert('Indique o nome.');
 const o={nome:n,naipe:g('m_np'),tel:g('m_t'),email:g('m_e'),authUid:g('m_uid').trim(),ativo:g('m_a')==='1',foto:U.mf.foto||''};
 if(U.mf.id)Object.assign(S.members.find(x=>x.id===U.mf.id),o);else S.members.push({id:uid(),perm:'leitura',...o});
 U.mf=null;save();render()}
function mDel(id){if(!confirm('Apagar este coralista e o respetivo histórico?'))return;S.members=S.members.filter(x=>x.id!==id);Object.values(S.att).forEach(a=>delete a[id]);if(db)db.collection('members').doc(id).delete();save();render()}
